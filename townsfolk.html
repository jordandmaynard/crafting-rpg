<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Townsfolk Viewer</title>
<style>
/* layout: the figure on a lit stage, controls in a side panel (stacked under it on phones). Dark first, like the game. */
:root {
  --bg: #17131a; --panel: #221c24; --line: #3a3038; --ink: #ece2d0; --dim: #a8988a; --accent: #d8a24a; --accentInk: #1a1208;
  --stage: radial-gradient(ellipse at 50% 70%, #4a4038 0%, #2a2428 55%, #17131a 100%); --errBg: #6a1e1a; --errInk: #fff;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #efe6d6; --panel: #f8f2e6; --line: #d6c8b0; --ink: #2a2018; --dim: #6a5a48; --accent: #a8641e; --accentInk: #fff8ec;
    --stage: radial-gradient(ellipse at 50% 70%, #d8ccb4 0%, #b8a888 60%, #8a7a62 100%); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #efe6d6; --panel: #f8f2e6; --line: #d6c8b0; --ink: #2a2018; --dim: #6a5a48; --accent: #a8641e; --accentInk: #fff8ec;
  --stage: radial-gradient(ellipse at 50% 70%, #d8ccb4 0%, #b8a888 60%, #8a7a62 100%); color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
#app { display: flex; height: 100%; }
#stage { flex: 1; position: relative; background: var(--stage); min-height: 320px; overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
#hint { position: absolute; left: 12px; bottom: 10px; color: var(--dim); font-size: 12px; pointer-events: none; }
#names { position: absolute; left: 0; right: 0; top: 10px; display: flex; justify-content: space-around; pointer-events: none; }
#names button { pointer-events: auto; }
#panel { width: 340px; flex: none; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 16px 24px; }
h1 { font-size: 17px; margin: 0 0 2px; }
.sub { color: var(--dim); font-size: 12px; margin: 0 0 12px; }
h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 16px 0 6px; font-weight: 600; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
button, input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent); color: var(--accentInk); border-color: var(--accent); }
input[type=number] { width: 110px; }
input[type=range] { flex: 1; padding: 0; }
.grid3 { display: grid; grid-template-columns: repeat(3, 40px); gap: 4px; }
.grid3 button { padding: 6px 0; }
.grid3 .mid { border: none; background: none; color: var(--dim); font-size: 11px; display: flex; align-items: center; justify-content: center; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td { padding: 3px 0; vertical-align: top; }
td:first-child { color: var(--dim); width: 58px; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.35); vertical-align: -1px; margin-right: 6px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; gap: 2px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 1px 2px 1px 10px; }
.chip button { border: none; background: none; padding: 2px 6px; }
.chip .x { color: var(--dim); }
.muted { color: var(--dim); font-size: 12px; }
kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
#err { position: fixed; left: 8px; right: 8px; bottom: 8px; background: var(--errBg); color: var(--errInk); padding: 8px 10px; border-radius: 6px; font: 12px ui-monospace, monospace; white-space: pre-wrap; z-index: 9; }
@media (max-width: 760px) {
  #app { flex-direction: column; height: auto; min-height: 100%; }
  #stage { height: 62vh; flex: none; }
  #panel { width: 100%; border-left: none; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="names"></div>
    <div id="hint">Drag to turn · <kbd>[</kbd> <kbd>]</kbd> seeds · <kbd>1</kbd>–<kbd>6</kbd> moves · <kbd>A</kbd> <kbd>D</kbd> facing · <kbd>Space</kbd> pause</div>
  </div>
  <div id="panel">
    <h1>Townsfolk</h1>
    <p class="sub">Each number is one person. Keep the ones you like.</p>

    <h2>Seed</h2>
    <div class="row">
      <button id="prev" title="Previous seed ([)">◀</button>
      <input id="seed" type="number" min="1" step="1">
      <button id="next" title="Next seed (])">▶</button>
      <button id="rand" title="Random seed (R)">Random</button>
    </div>
    <div class="row" style="margin-top:6px">
      <span class="muted">Body</span>
      <button data-body="any" class="on">Any</button><button data-body="masc">Masculine</button><button data-body="fem">Feminine</button>
    </div>
    <div class="row" style="margin-top:6px">
      <span class="muted">Show</span>
      <button data-mode="one" class="on">One</button><button data-mode="line">Lineup of 7</button>
    </div>

    <h2>Move</h2>
    <div class="row" id="anims"></div>
    <div class="row" style="margin-top:6px">
      <span class="muted">Speed</span><input id="speed" type="range" min="0" max="2" step="0.05" value="1">
      <button id="pause" title="Space">Pause</button>
    </div>

    <h2>Facing</h2>
    <div class="row" style="gap:14px; align-items:flex-start">
      <div class="grid3" id="facings"></div>
      <div style="display:flex; flex-direction:column; gap:6px">
        <button id="spin">Turntable</button>
        <span class="muted" id="faceLbl"></span>
      </div>
    </div>

    <h2>View</h2>
    <div class="row"><span class="muted" style="width:62px">Pixel size</span><input id="px" type="range" min="1" max="5" step="1" value="3"><span id="pxv" class="muted">3</span></div>
    <div class="row"><span class="muted" style="width:62px">Camera tilt</span><input id="tilt" type="range" min="0" max="50" step="1" value="17"><span id="tiltv" class="muted">17°</span></div>
    <div class="row"><span class="muted" style="width:62px">Zoom</span><input id="zoom" type="range" min="0.6" max="2.2" step="0.05" value="1"></div>

    <h2>Outfit</h2>
    <table id="outfit"></table>

    <h2>Kept</h2>
    <div class="row" style="margin-bottom:8px"><button id="keep">Keep this seed</button><button id="copy">Copy list</button></div>
    <div class="chips" id="kept"></div>
    <p class="muted" id="keptNote">Nothing kept yet.</p>
  </div>
</div>
<div id="err" hidden></div>
<script>
// (an on-screen box for errors, since there's no console to read them in)
const errBox = document.getElementById('err');
const showErr = m => { errBox.hidden = false; errBox.textContent += m + '\n'; };
addEventListener('error', e => showErr(e.message + (e.filename ? ` (${e.filename.split('/').pop()}:${e.lineno})` : '')));
addEventListener('unhandledrejection', e => showErr(String(e.reason && e.reason.stack || e.reason)));
</script>
<script type="module">
import * as GFX from './src/gfx/index.js';
import { makeFolkKit, design, describe, ANIMS } from './src/folk/townsfolk.js';

const $ = id => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem('emberwild.folk.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('emberwild.folk.' + k, JSON.stringify(v)); } catch (e) { /* (no storage) */ } } };

const renderer = await GFX.createRenderer().catch(err => {
  $('stage').insertAdjacentHTML('beforeend', `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center">This viewer draws with WebGPU, which this browser doesn't offer (${err.message}).</div>`);
  throw err;
});
renderer.shadowMap.enabled = false;
const cv = $('view');
const target = renderer.canvasTarget(cv);
const scene = new GFX.Scene();
const cam = new GFX.PerspectiveCamera(20, 1, 0.1, 60);
// the character view's studio lights (the game's dollLights): sky and ground, and a sun up and to the camera's left
const lights = { hemi: new GFX.HemisphereLight('#fff1dc', '#6a5440', 0.95), sun: new GFX.DirectionalLight('#fff0dc', 1.5), points: [], plain: true };
lights.sun.castShadow = false;
const kit = makeFolkKit(GFX);

// ---------- state ----------
const S = {
  seed: 1, body: 'any', mode: 'one', anim: 'idle', speed: 1, paused: false, facing: 0, spin: false,
  px: store.get('px', 3), tilt: store.get('tilt', 17), zoom: store.get('zoom', 1), kept: store.get('kept', []),
};
const hashSeed = parseInt((location.hash.match(/seed=(\d+)/) || [])[1], 10);
S.seed = hashSeed > 0 ? hashSeed : store.get('seed', 1);
let folks = [], yawDrag = 0, t = 0;

const fits = s => S.body === 'any' || design(s).body === S.body;
function step(dir) { let s = S.seed; for (let n = 0; n < 500; n++) { s = Math.max(1, s + dir); if (fits(s)) break; if (s === 1 && dir < 0) break; } setSeed(s); }
function randomSeed() { let s; for (let n = 0; n < 200; n++) { s = 1 + Math.floor(Math.random() * 999999); if (fits(s)) break; } setSeed(s); }
function lineSeeds() { const out = [S.seed]; let s = S.seed; while (out.length < 7 && s < S.seed + 4000) { s++; if (fits(s)) out.push(s); } return out; }

function setSeed(s) {
  S.seed = Math.max(1, s | 0); store.set('seed', S.seed);
  history.replaceState(null, '', '#seed=' + S.seed);
  $('seed').value = S.seed;
  rebuild();
  keptList();
}
function rebuild() {
  for (const f of folks) scene.remove(f.g);
  const seeds = S.mode === 'one' ? [S.seed] : lineSeeds(), gap = 0.78;
  folks = seeds.map((s, i) => {
    const f = kit.build(design(s));
    f.g.position.x = (i - (seeds.length - 1) / 2) * gap;
    f.offset = S.mode === 'one' ? 0 : (s * 0.618) % 1 * 5;   // (each in the lineup out of step with the rest)
    scene.add(f.g);
    return f;
  });
  // the lineup's seeds, over each figure: click one to look at them on their own
  $('names').innerHTML = S.mode === 'one' ? '' : seeds.map(s => `<button data-s="${s}">${s}</button>`).join('');
  outfit(design(S.seed));
}
function outfit(d) {
  $('outfit').innerHTML = describe(d).map(([k, v, c]) => `<tr><td>${k}</td><td>${c ? `<span class="sw" style="background:${c}"></span>` : ''}${v}</td></tr>`).join('')
    + `<tr><td>Skin</td><td><span class="sw" style="background:${d.skin}"></span>${d.skin}</td></tr>`;
}
function keptList() {
  $('kept').innerHTML = S.kept.map(s => `<span class="chip"><button data-load="${s}">${s}</button><button class="x" data-drop="${s}" aria-label="Remove ${s}">×</button></span>`).join('');
  $('keptNote').style.display = S.kept.length ? 'none' : '';
  $('keep').textContent = S.kept.includes(S.seed) ? 'Kept' : 'Keep this seed';
}

// ---------- controls ----------
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('rand').onclick = randomSeed;
$('seed').onchange = e => setSeed(parseInt(e.target.value, 10) || 1);
document.querySelectorAll('[data-body]').forEach(b => b.onclick = () => {
  S.body = b.dataset.body; document.querySelectorAll('[data-body]').forEach(x => x.classList.toggle('on', x === b));
  if (!fits(S.seed)) step(1); else rebuild();
});
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
  S.mode = b.dataset.mode; document.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x === b)); rebuild();
});
$('names').onclick = e => { const s = e.target.dataset && e.target.dataset.s; if (s) { document.querySelector('[data-mode="one"]').click(); setSeed(+s); } };
const animNames = { idle: 'Idle', walk: 'Walk', talk: 'Talk', wave: 'Wave', carry: 'Carry', sweep: 'Sweep' };
$('anims').innerHTML = ANIMS.map((a, i) => `<button data-anim="${a}" title="${i + 1}">${animNames[a]}</button>`).join('');
const setAnim = a => { S.anim = a; document.querySelectorAll('[data-anim]').forEach(x => x.classList.toggle('on', x.dataset.anim === a)); };
document.querySelectorAll('[data-anim]').forEach(b => b.onclick = () => setAnim(b.dataset.anim));
setAnim('idle');
$('speed').oninput = e => S.speed = +e.target.value;
const setPause = p => { S.paused = p; $('pause').textContent = p ? 'Play' : 'Pause'; $('pause').classList.toggle('on', p); };
$('pause').onclick = () => setPause(!S.paused);
// the eight facings, laid out as seen from above with the camera at the bottom: the middle one faces you
const FACE_NAMES = ['Front', 'Front-left', 'Left', 'Back-left', 'Back', 'Back-right', 'Right', 'Front-right'];
const FACE_GRID = [3, 4, 5, 2, -1, 6, 1, 0, 7], ARROW = ['↓', '↙', '←', '↖', '↑', '↗', '→', '↘'];
$('facings').innerHTML = FACE_GRID.map(k => k < 0 ? '<span class="mid">top</span>' : `<button data-face="${k}" title="${FACE_NAMES[k]}">${ARROW[k]}</button>`).join('');
const setFace = k => { S.facing = ((k % 8) + 8) % 8; yawDrag = 0; S.spin = false; $('spin').classList.remove('on'); faceUi(); };
function faceUi() {
  document.querySelectorAll('[data-face]').forEach(x => x.classList.toggle('on', !S.spin && !yawDrag && +x.dataset.face === S.facing));
  $('faceLbl').textContent = S.spin ? 'turning' : yawDrag ? 'free' : FACE_NAMES[S.facing];
}
document.querySelectorAll('[data-face]').forEach(b => b.onclick = () => setFace(+b.dataset.face));
$('spin').onclick = () => { S.spin = !S.spin; $('spin').classList.toggle('on', S.spin); faceUi(); };
faceUi();
const slider = (id, key, fmt) => { const el = $(id); el.value = S[key]; const show = () => { if ($(id + 'v')) $(id + 'v').textContent = fmt(S[key]); }; show(); el.oninput = () => { S[key] = +el.value; store.set(key, S[key]); show(); }; };
slider('px', 'px', v => v); slider('tilt', 'tilt', v => v + '°'); slider('zoom', 'zoom', v => v);
$('keep').onclick = () => { if (!S.kept.includes(S.seed)) S.kept.push(S.seed); else S.kept = S.kept.filter(s => s !== S.seed); store.set('kept', S.kept); keptList(); };
$('kept').onclick = e => {
  const d = e.target.dataset;
  if (d.load) setSeed(+d.load);
  else if (d.drop) { S.kept = S.kept.filter(s => s !== +d.drop); store.set('kept', S.kept); }
  keptList();
};
$('copy').onclick = async () => {
  const text = S.kept.length ? S.kept.join(', ') : String(S.seed);
  try { await navigator.clipboard.writeText(text); $('copy').textContent = 'Copied'; } catch (e) { prompt('Seeds:', text); }
  setTimeout(() => $('copy').textContent = 'Copy list', 1200);
};
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'number') return;
  const k = e.key.toLowerCase();
  if (k === '[') step(-1); else if (k === ']') step(1); else if (k === 'r') randomSeed();
  else if (k === 'a' || k === 'arrowleft') setFace(S.facing + 1); else if (k === 'd' || k === 'arrowright') setFace(S.facing - 1);
  else if (k === ' ') { setPause(!S.paused); e.preventDefault(); }
  else if (k >= '1' && k <= '6') setAnim(ANIMS[+k - 1]);
  else if (k === 'k') $('keep').click();
});
// drag across the picture to turn them freely
let drag = null;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y0: yawDrag }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (!drag) return; yawDrag = drag.y0 + (e.clientX - drag.x) * 0.012; S.spin = false; $('spin').classList.remove('on'); faceUi(); });
cv.addEventListener('pointerup', () => drag = null);

// ---------- drawing ----------
let last = performance.now(), spinYaw = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!S.paused) t += dt * S.speed;
  if (S.spin) spinYaw += dt * 0.8;
  // the canvas at the game's pixel size, drawn blocky
  const r = cv.getBoundingClientRect(), k = (devicePixelRatio || 1) / S.px;
  const w = Math.max(16, Math.round(r.width * k)), h = Math.max(16, Math.round(r.height * k));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const yaw = S.spin ? spinYaw : -S.facing * Math.PI / 4 + yawDrag;
  for (const f of folks) { kit.pose(f, S.anim, t + f.offset); f.g.rotation.y = yaw; }
  // frame the figure (or the lineup) whatever the canvas's shape, from DOLL_VIEW's height and aim
  const aspect = w / h, span = S.mode === 'one' ? 0.75 : 7 * 0.78, tall = 1.45;
  const vf = 20 * Math.PI / 180, need = Math.max(tall / 2 / Math.tan(vf / 2), span / 2 / (Math.tan(vf / 2) * aspect));
  const dist = need / S.zoom, a = S.tilt * Math.PI / 180, aimY = 0.6;
  cam.fov = 20; cam.aspect = aspect; cam.updateProjectionMatrix();
  cam.position.set(0, aimY + Math.sin(a) * dist, Math.cos(a) * dist);
  cam.lookAt(0, aimY, 0); cam.updateMatrixWorld();
  const la = -0.9;
  lights.sun.position.set(Math.sin(la) * 4, aimY + 5, Math.cos(la) * 4); lights.sun.target.position.set(0, aimY, 0);
  lights.sun.updateMatrixWorld(); lights.sun.target.updateMatrixWorld();
  renderer.lightsOverride = lights;
  renderer.setRenderTarget(target); renderer.setClearColor(0x000000, 0); renderer.clear();
  renderer.render(scene, cam);
  renderer.endFrame();
  requestAnimationFrame(frame);
}
$('seed').value = S.seed;
keptList();
rebuild();
requestAnimationFrame(frame);
// (a hook for checks)
window.FOLK = { S, design, folks: () => folks, setSeed, setAnim };
</script>
</body>
</html>
